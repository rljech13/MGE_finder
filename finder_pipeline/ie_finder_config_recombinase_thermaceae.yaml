paths:
  config_file: "ie_finder_config_recombinase_thermaceae.yaml"
  genomes_dir: "data/genomes_thermaceae"
  results_dir: "results_thermaceae_recombinase"

execution:
  conda_env: "../envs/IE_finder.yaml"

input_sources:
  - "data/genomes_thermaceae"

ncbi_pattern: "*_genomic.fna"
hybracter_pattern: "barcode*.fastq_final.fasta"
bins_pattern: "*.fa"

reject_ambiguous_n: true
reject_ambiguous_n_ie: false

filters:
  trna_max_distance_bp: 500
  v3ps_shift: 3
  attl_window_bp: 300000
  attl_candidate_min_bp: 8
  attl_exact_min_bp: 14
  attl_relaxed_min_bp: 17
  attl_reject_gapped: true
  integrase_min_aa: 300
  ie_min_nt: 0

dedup:
  enabled: true
  min_seq_id: 0.9
  min_coverage: 0.8

pfam_profiles:
  - "../pfam/PF00239.hmm"
  - "../pfam/PF07508.hmm"
