paths:
  config_file: "ie_finder_config_recombinase.yaml"
  genomes_dir: "data/genomes_recombinase"
  results_dir: "results_recombinase"

execution:
  # Path relative to finder_pipeline/ (Snakemake --use-conda)
  conda_env: "../envs/IE_finder.yaml"

input_sources:
  - "data/genomes_recombinase"

ncbi_pattern: "*_genomic.fna"
hybracter_pattern: "barcode*.fastq_final.fasta"
bins_pattern: "*.fa"

# Skip genome assemblies containing ambiguous N before ORF prediction.
reject_ambiguous_n: true
# Not a cascade step. Alignment gaps are rejected inside filter_confident_ie.py.
reject_ambiguous_n_ie: false

# Cascade in filter_confident_ie.py, in manuscript order:
# exact duplication >= 8 bp -> integrase > 300 aa -> attL non-coding ->
# exact run >= 14 bp, or BLAST length >= 17 bp with mismatches allowed ->
# no alignment gaps. Deduplication is the next Snakemake rule.
filters:
  trna_max_distance_bp: 500
  v3ps_shift: 3
  attl_window_bp: 300000
  attl_candidate_min_bp: 8
  attl_exact_min_bp: 14
  attl_relaxed_min_bp: 17
  attl_reject_gapped: true
  integrase_min_aa: 300
  ie_min_nt: 0

# MMseqs2 deduplication of confident IE set (Stage 9)
dedup:
  enabled: true
  min_seq_id: 0.9
  min_coverage: 0.8
  # mmseqs_bin: null  # auto-detect from PATH

# Recombinase/resolvase PFAM profiles (replaces PF00589 + PF22022 integrase set)
pfam_profiles:
  - "../pfam/PF00239.hmm"
  - "../pfam/PF07508.hmm"
