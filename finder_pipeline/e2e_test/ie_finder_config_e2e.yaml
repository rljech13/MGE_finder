paths:
  config_file: "e2e_test/ie_finder_config_e2e.yaml"
  genomes_dir: "data/e2e_genomes"
  results_dir: "results_e2e"

execution:
  conda_env: "../envs/IE_finder.yaml"

input_sources:
  - "data/e2e_genomes"

ncbi_pattern: "*.fna"
hybracter_pattern: "none.fasta"
bins_pattern: "none.fa"

reject_ambiguous_n: true
reject_ambiguous_n_ie: false

filters:
  trna_max_distance_bp: 500
  v3ps_shift: 3
  attl_window_bp: 300000
  attl_candidate_min_bp: 8
  attl_exact_min_bp: 14
  attl_relaxed_min_bp: 17
  attl_reject_gapped: true
  integrase_min_aa: 300
  ie_min_nt: 0

dedup:
  enabled: true
  min_seq_id: 0.9
  min_coverage: 0.8

pfam_profiles:
  - "../pfam/PF00589.hmm"
  - "../pfam/PF22022.hmm"
