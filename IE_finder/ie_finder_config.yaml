paths:
  config_file: "ie_finder_config.yaml"
  genomes_dir: "data/genomes"
  results_dir: "results"

execution:
  # Path relative to IE_finder/ (Snakemake --use-conda)
  conda_env: "../envs/IE_finder.yaml"

input_sources:
  - "data/genomes"

ncbi_pattern: "*_genomic.fna"
hybracter_pattern: "barcode*.fastq_final.fasta"
bins_pattern: "*.fa"

# Skip genome assemblies containing ambiguous N before ORF prediction.
reject_ambiguous_n: true
# Flag for downstream IE QC: drop IE with N gaps.
reject_ambiguous_n_ie: true

# Confident IE set filters (filter_confident_ie.py)
filters:
  v3ps_shift: 3
  attl_min_bp: 15
  integrase_min_aa: 300
  ie_min_nt: 2000

# MMseqs2 deduplication of confident IE set (Stage 9)
dedup:
  enabled: true
  min_seq_id: 0.9
  min_coverage: 0.8
  # mmseqs_bin: null  # auto-detect from PATH

pfam_profiles:
  - "../pfam/PF00589.hmm"
  - "../pfam/PF22022.hmm"
